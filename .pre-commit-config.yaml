default_language_version:
  python: python3.11

default_stages: [ commit, push ]
fail_fast: false
exclude: ".git|.tox|module_function_parser_test_invalid.py"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace


  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
    - id: hadolint-docker
      args: [--failure-threshold, warning]


  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    - id: detect-secrets
      exclude: 'tenant/offline_enrichment_data/IACscan/offline_data.json|k8s_jobs/modelknox/azure/az_knowledgebase.json|k8s_jobs/garak_scan/azure/az_knowledgebase.json|tenant/fixtures/vulnerabilitydefaultfilters.json|tenant/fixtures/collectortype.json|tenant/offline_enrichment_data/Semgrep/Semgrep_ruleset.json|tenant/fixtures/aspm_scantype.json'



  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.21
    hooks:
      - id: helmlint
      - id: shellcheck


  - repo: https://github.com/psf/black
    rev: "23.3.0"
    hooks:
      - id: black


  - repo: https://github.com/timothycrosley/isort
    rev: "5.12.0"
    hooks:
      - id: isort



  # -   repo: https://github.com/PyCQA/flake8
  #     rev: 6.0.0
  #     hooks:
  #     -   id: flake8
  #         args: [--config=.flake8]
  #         additional_dependencies: [flake8-isort]


  - repo: https://github.com/asottile/add-trailing-comma
    rev: v2.4.0
    hooks:
      - id: add-trailing-comma

