# DSPM scanner findings: /var/lib/dspm/output/<instance>/findings/<target>-<date>.json
# The container runs as UID 1001. systemd-tmpfiles-clean.timer removes files older than 30 days;
# the instance directories themselves are kept.
d /var/lib/dspm/output 0750 1001 0 -
e /var/lib/dspm/output/*/findings - - - 30d
